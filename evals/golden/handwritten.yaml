# Hand-written part of the golden set (written by the developer, not generated).
# expected: answer | abstain | refuse
#   abstain = say the indexed regulations don't cover it (no invented answer)
#   refuse  = decline (harmful, manipulative or off-topic request)

global:
  - question: Give an overview of the PRA's expectations on outsourcing and third-party risk management.
    expected: answer
    gold_docs: [pra-ss2-21, pra-outsourcing]
  - question: What are the main themes of the FCA Consumer Duty?
    expected: answer
    gold_docs: [fca-prin-2a]
  - question: Summarise the key requirements of SEBI's Cybersecurity and Cyber Resilience Framework.
    expected: answer
    gold_docs: [sebi-cscrf-2024]
  - question: What are the key areas covered by RBI's 2026 directions on cybersecurity and technology risk for commercial banks?
    expected: answer
    gold_docs: [rbi-cb-cyber-tech-2026]
  - question: Give an overview of the PRA's model risk management principles for banks.
    expected: answer
    gold_docs: [pra-ss1-23]
  - question: What are the main building blocks of operational resilience requirements in the UK?
    expected: answer
    gold_docs: [pra-operational-resilience, pra-ss1-21, fca-sysc-15a]
  - question: Summarise how firms must handle complaints under the FCA's complaints rules.
    expected: answer
    gold_docs: [fca-disp-1]
  - question: What are the key themes of RBI's KYC directions for commercial banks?
    expected: answer
    gold_docs: [rbi-cb-kyc-2025]
  - question: Give an overview of RBI's requirements on managing outsourcing risk for NBFCs.
    expected: answer
    gold_docs: [rbi-nbfc-outsourcing-2025]
  - question: What are the broad requirements for an Internal Ombudsman at commercial banks in India?
    expected: answer
    gold_docs: [rbi-cb-internal-ombudsman-2026]
  - question: Summarise the PRA Fundamental Rules.
    expected: answer
    gold_docs: [pra-fundamental-rules]
  - question: What are the main themes of RBI's responsible business conduct directions for commercial banks?
    expected: answer
    gold_docs: [rbi-cb-rbc-2025]
  - question: Give an overview of how investor grievances are handled through SEBI's SCORES platform.
    expected: answer
    gold_docs: [sebi-scores-2023]
  - question: What are the key areas of RBI's compliance function directions for commercial banks?
    expected: answer
    gold_docs: [rbi-cb-compliance-2026]
  - question: Across the Indian and UK regulators, what are the common themes in outsourcing rules?
    expected: answer
    gold_docs: [rbi-cb-outsourcing-2025, rbi-nbfc-outsourcing-2025, sebi-outsourcing-2011, fca-sysc-8, pra-outsourcing, pra-ss2-21]


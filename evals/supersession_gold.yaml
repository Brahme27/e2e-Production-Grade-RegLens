# Hand-labelled supersession edges, read from the source documents (not from extractor output).
# Scope: every document listed in `labelled_sources` has ALL its repeal/amend edges listed here,
# both to documents in our corpus and to numbered circulars/letters we do not hold ("ext:").
# Predictions from other sources are not scored. Labelled 2026-10-24.

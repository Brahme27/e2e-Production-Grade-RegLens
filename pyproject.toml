[project]
name = "reglens"
version = "0.1.0"
description = "Regulatory change-impact copilot (RBI, SEBI, FCA, PRA): cited, time-aware answers and obligation gap analysis"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # service basics
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
    "httpx>=0.27",
    # storage
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "qdrant-client>=1.15",
    # ingestion: HTML + PDF text
    "selectolax>=0.3.27",
    "pypdfium2>=4.30",
    # retrieval: local ONNX embedding / sparse / reranker models (CPU)
    "fastembed>=0.7",
    # LLMs + workflow
    "litellm>=1.75",
    "langgraph>=0.6",
]

[dependency-groups]
# training / analysis only - never shipped in the API image
ml = ["scikit-learn>=1.5"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.110",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "pre-commit>=3.8",
    "poethepoet>=0.28",
]

[tool.uv]
default-groups = ["dev", "ml"]
link-mode = "copy"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reglens"]

[tool.poe.tasks]
format = { cmd = "ruff format src tests", help = "Auto-format code" }
lint = { cmd = "ruff check src tests", help = "Static lint checks" }
typecheck = { cmd = "mypy src", help = "Static type checks" }
test = { cmd = "pytest", help = "Run tests with coverage" }
check = { sequence = ["lint", "typecheck", "test"], help = "Everything CI runs" }
crawl = { cmd = "python -m reglens.corpus.crawl", help = "Download the curated regulatory corpus (cached)" }
parse = { cmd = "python -m reglens.parse.run", help = "Parse raw documents into numbered paragraphs" }
temporal = { cmd = "python -m reglens.temporal.run", help = "Supersession graph + validity intervals -> DB" }
index = { cmd = "python -m reglens.index.build", help = "Chunk, contextualise, embed and load all index variants" }
golden = { cmd = "python -m reglens.evals.build_golden", help = "Build the golden evaluation set (LLM, cached)" }
router = { cmd = "python -m reglens.retrieve.train_router", help = "Train the query router" }
ablation = { cmd = "python -m reglens.evals.ablation", help = "Retrieval ablation A-G (no LLM)" }
eval-answers = { cmd = "python -m reglens.evals.generation --calibrate", help = "End-to-end answer evaluation with LLM judge" }
eval-impact = { cmd = "python -m reglens.evals.impact_eval", help = "Obligation extraction + gap judgement evaluation" }
results = { cmd = "python -m reglens.results", help = "Write docs/RESULTS.md from artifacts/reports" }
api = { cmd = "uvicorn reglens.api.app:create_app --factory --reload --port 8000", help = "Run the API" }
pipeline = { sequence = ["crawl", "parse", "temporal", "index", "router"], help = "Corpus -> parsed -> time model -> indexes -> router" }
worker = { cmd = "python -m reglens.worker --once", help = "One scheduled-worker cycle (crawl, parse, temporal, re-index)" }
web = { cmd = "pnpm --dir frontend dev", help = "Run the console in dev mode" }
e2e = { cmd = "pnpm --dir frontend exec playwright test", help = "Playwright E2E against a running stack" }
up = { cmd = "docker compose up -d --build", help = "Build and start the stack" }
down = { cmd = "docker compose down", help = "Stop the stack" }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF", "PL"]
# RUF001-003: regulatory text is full of typographic quotes and dashes we must match
# S311: random is used for reproducible sampling, never for security
ignore = ["PLR0913", "RUF001", "RUF002", "RUF003", "S311"]

[tool.ruff.lint.pycodestyle]
max-line-length = 140  # the formatter wraps code at 100; long prompt/regex strings may run to 140

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "E501"]  # long lines = inline HTML fixtures

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["litellm.*", "sklearn.*", "fastembed.*", "pypdfium2.*", "selectolax.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=reglens --cov-report=term-missing"

[tool.coverage.run]
source = ["reglens"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

# Quality + technical alerts for the question-answering service.
groups:
  - name: reglens-answers
    rules:
      - alert: AbstentionRateHigh
        # the share of questions we cannot answer jumped: index broken, or users asking about
        # documents we have not indexed yet (add them to configs/sources.yaml)
        expr: |
          sum(rate(reglens_ask_outcomes_total{outcome="abstained"}[1h]))
            / sum(rate(reglens_ask_outcomes_total[1h])) > 0.35
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "More than 35% of questions abstained in the last hour"

      - alert: RefusalSpike
        expr: sum(rate(reglens_ask_outcomes_total{outcome="refused"}[15m])) * 60 > 5
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "More than 5 refused (guardrail) questions per minute: possible probing / abuse"

      - alert: AnswerLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(reglens_ask_seconds_bucket[10m])) by (le)) > 6
        for: 15m
        labels: {severity: page}
        annotations:
          summary: "p95 answer latency above the 6 s target"

      - alert: NegativeFeedbackHigh
        expr: |
          sum(increase(reglens_feedback_total{score="down"}[1d]))
            / clamp_min(sum(increase(reglens_feedback_total[1d])), 1) > 0.3
        for: 1h
        labels: {severity: info}
        annotations:
          summary: "More than 30% thumbs-down in the last day: review traces in Langfuse"

      - alert: RegLensApiDown
        expr: up{job="reglens-api"} == 0
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "RegLens API is not being scraped"

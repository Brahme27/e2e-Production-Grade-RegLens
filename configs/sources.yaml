# RegLens curated corpus: 37 documents from RBI, SEBI, FCA and PRA on six shared themes:
# KYC, outsourcing, cyber/IT and operational resilience, grievance redressal / complaints,
# governance and compliance, model risk and AI.
#
# Older versions come from each regulator's own archive (PRA Rulebook point-in-time
# pages, Bank of England PDF editions) or, where the regulator's PDF server blocks
# automated downloads (rbidocs.rbi.org.in), from the Internet Archive's Wayback Machine.
#
# applies_to vocabulary: commercial_banks, nbfcs, uk_banks (PRA-authorised banks and building
# societies), fca_firms, sebi_intermediaries, market_infrastructure, all_sebi_entities.

